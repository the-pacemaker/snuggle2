<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="format-detection" content="telephone=no">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — Snuggle</title>
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#3c280d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=2">
</head>
<body>
  <main class="home" id="welcome-lobby">
    <!-- Header / Branding -->
    <header class="home__header">
      <h1 class="home__logo">Snuggle</h1>
      <p class="home__tagline">
        A place where two can hang out together,<br>
        from anywhere<br>
        [You are advised to stay on call]    
      </p>
    </header>

    <nav class="home__nav" aria-label="Room options">
      <!-- Create a Room -->
      <button type="button" class="nav-btn" id="create-btn" aria-label="Create a new room">
        <span class="nav-btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
        </span>
        <span class="nav-btn__label">Create a Room</span>
      </button>

      <!-- Join a Room -->
      <div class="nav-btn nav-btn--expandable" id="join-wrap">
        <button type="button" class="nav-btn__trigger" id="join-btn" aria-expanded="false" aria-controls="join-input-area">
          <span class="nav-btn__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
          </span>
          <span class="nav-btn__label">Join a Room</span>
          <span class="nav-btn__chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </button>

        <!-- Expandable join input -->
        <div class="nav-btn__expand-area" id="join-input-area" aria-hidden="true">
          <div class="yt-join-input-row">
            <input
              type="text"
              id="room-code-input"
              class="yt-code-input"
              placeholder="Enter room code"
              maxlength="6"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              aria-label="Room code"
            >
            <button type="button" class="yt-join-submit" id="join-submit-btn" aria-label="Join room">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
          </div>
          <p class="yt-join-error" id="join-error" aria-live="polite" style="display:none; color: #ff6b6b; margin-top: 10px; font-size: 14px; text-align: center;"></p>
        </div>
      </div>
    </nav>
    <p style="text-align: center; color: white; margin-top: 40px; font-size: 14px; opacity: 0.8;">
      For suggestions or issues, contact: <a href="mailto:snuggle_support@proton.me" style="color: white; text-decoration: underline;">snuggle_support@proton.me</a>
    </p>
  </main>

  <script src="/js/analytics.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('loaded');
      
      const createBtn = document.getElementById('create-btn');
      const joinBtn = document.getElementById('join-btn');
      const joinWrap = document.getElementById('join-wrap');
      const joinInputArea = document.getElementById('join-input-area');
      const codeInput = document.getElementById('room-code-input');
      const joinSubmit = document.getElementById('join-submit-btn');
      const joinError = document.getElementById('join-error');

      let ws = null;
      let pendingCode = null;

      function connectAndJoin(action, code) {
        joinError.style.display = 'none';
        
        try {
          const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          ws = new WebSocket(`${protocol}//${window.location.host}`);
        } catch (err) {
          joinError.textContent = 'Failed to connect to server.';
          joinError.style.display = 'block';
          return;
        }

        ws.onopen = () => {
          if (action === 'create') {
            ws.send(JSON.stringify({ type: 'create_room' }));
          } else if (action === 'join') {
            ws.send(JSON.stringify({ type: 'join_room', code: code }));
          }
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'room_created' || msg.type === 'room_joined') {
              sessionStorage.setItem('snuggle_room_code', msg.code);
              ws.close();
              window.location.href = '/home';
            } else if (msg.type === 'error') {
              joinError.textContent = msg.message || 'Error joining room.';
              joinError.style.display = 'block';
              ws.close();
            }
          } catch (e) {
            console.error(e);
          }
        };

        ws.onerror = () => {
          joinError.textContent = 'WebSocket error.';
          joinError.style.display = 'block';
        };
      }

      function join(code) {
        if (!code || code.length < 4) {
          joinError.textContent = 'Enter a valid room code (4–6 characters).';
          joinError.style.display = 'block';
          return;
        }
        connectAndJoin('join', code);
      }

      createBtn.addEventListener('click', () => {
        connectAndJoin('create', null);
      });

      joinBtn.addEventListener('click', () => {
        const expanded = joinBtn.getAttribute('aria-expanded') === 'true';
        joinBtn.setAttribute('aria-expanded', String(!expanded));
        joinInputArea.setAttribute('aria-hidden', String(expanded));
        joinWrap.classList.toggle('nav-btn--open', !expanded);
        if (!expanded && codeInput) {
          if (!codeInput.value) {
            setTimeout(() => codeInput.focus(), 200);
          }
        }
      });

      joinSubmit.addEventListener('click', () => {
        join(codeInput.value.trim().toUpperCase());
      });

      codeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') join(codeInput.value.trim().toUpperCase());
      });

      codeInput.addEventListener('input', () => {
        codeInput.value = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        joinError.style.display = 'none';
      });
    });
  </script>
</body>
</html>
