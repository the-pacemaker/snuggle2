<!DOCTYPE html>
<html lang="en"><head>
  <meta name="format-detection" content="telephone=no">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snuggle-Strands</title>
<style>

@font-face { font-family: "nyt-franklin"; src: url("https://www.nytimes.com/games-assets/v2/fonts/franklin/franklin-normal-500.woff2") format("woff2"); font-weight: 500; font-style: normal; }
@font-face { font-family: "nyt-franklin"; src: url("https://www.nytimes.com/games-assets/v2/fonts/franklin/franklin-normal-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
@font-face { font-family: "nyt-karnak"; src: url("https://www.nytimes.com/games-assets/v2/fonts/karnak/karnak-normal-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
@font-face { font-family: "nyt-karnakcondensed"; src: url("https://www.nytimes.com/games-assets/v2/fonts/karnakcondensed/karnakcondensed-normal-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }

:root{--bg:#3c280d;--panel:#af804f;--ink:#3c280d;--accent:#f4a261;--sel:#a6d8d4;--theme:#6ba1dd;--span:#fe9f28;--remote:#d4a6d8;--font-sans:"nyt-franklin","Helvetica Neue",Arial,sans-serif;--font-serif:"nyt-karnak",Karnak,Georgia,serif;--font-title:"nyt-karnakcondensed",Karnak,Georgia,serif;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#fff;font-family:var(--font-sans);-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding-bottom:24px}
#bar{width:100%;height:52px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:var(--bg);border-bottom:1px solid rgba(244,162,97,.2)}
#bar .l{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:6px;font:600 14px inherit;cursor:pointer}
#dot{width:10px;height:10px;border-radius:50%;background:#f39c12}
h1{margin:14px 0 0;font:700 32px var(--font-title);letter-spacing:.5px}
#date{font-size:13px;opacity:.65;margin:14px 0 10px}
#riddle{text-align:center;margin-bottom:6px;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:12px;background:rgba(255,255,255,.05)}
#riddle .lab{display:inline-block;background:var(--theme);color:var(--ink);font:700 11px/1 var(--font-sans);letter-spacing:.8px;text-transform:uppercase;padding:5px 10px;border-radius:3px}
#riddle .clue{display:block;font:700 22px/1.2 var(--font-serif);margin-top:8px;min-height:27px}
#riddle.done .lab{background:var(--span)}
#word{height:34px;font:700 24px/34px var(--font-sans);letter-spacing:2px;text-transform:uppercase}
#word.ok{color:var(--theme)}#word.sp{color:var(--span)}#word.bad{animation:shake .32s}
#word.msg{font-size:16px;letter-spacing:1px;text-transform:none;color:#ccc}

#board{position:relative;width:max(260px,min(96vw,440px,calc((100dvh - 290px)*.75)));aspect-ratio:6/8;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(8,1fr);touch-action:none;user-select:none;-webkit-user-select:none}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.t{position:relative;z-index:1;isolation:isolate;display:grid;place-items:center;border:0;background:none;color:#fff;font:700 clamp(20px,6.5vw,28px) var(--font-sans);padding:0;cursor:pointer;outline:0}
.t::before{content:'';position:absolute;inset:11%;border-radius:50%;background:transparent;z-index:-1;transition:background .15s,transform .15s,box-shadow .3s ease}
.t.sel{color:var(--ink)}.t.sel::before{background:var(--sel);transform:scale(1.04)}
.t.rem::before{background:var(--remote)}.t.rem{color:var(--ink)}
.t.th::before{background:var(--theme)}
.t.sp::before{background:var(--span)}.t.sp{color:var(--ink)}
.t.hint::before{border:3px dotted var(--theme)}
.t.hint-seq::before{animation:pulseHintOutline 4s linear var(--d,0ms) infinite}
.t.pop{animation:pop .2s ease}
.t.wave{animation:wave .6s ease var(--d,0ms) both}
.t.shake{animation:shake .32s}
@keyframes pop{50%{transform:scale(.85)}}
@keyframes wave{0%{transform:scale(1)}15%{transform:scale(.62)}38%{transform:scale(1.13)}77%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes pulseHintOutline{0%{transform:scale(1)}3.75%{transform:scale(0.85)}9.5%{transform:scale(1.1)}25%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#foot{margin-top:14px;text-align:center;font-size:15px}
#hint{position:relative;overflow:hidden;margin-top:10px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:22px;padding:9px 26px;font:700 15px inherit;cursor:pointer}
#hint::before{content:'';position:absolute;top:0;left:0;bottom:0;width:calc(var(--fill,0)*33.333%);background:var(--theme);transition:width .3s ease;z-index:0}
#hint span{position:relative;z-index:1}
#hint.ready{background:var(--theme);color:var(--ink);border-color:var(--theme)}
#hint.ready::before{display:none}
#hint[hidden]{display:none}
@media(max-width:420px){.pill .rl{display:none}}
</style></head><body>
<div id="bar">
  <div class="l">
    <button class="pill" id="back" onclick="location.href='/games/'" aria-label="Back to games" style="padding:4px 8px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      <span>Back</span>
    </button>
    <span id="dot"></span><span id="status">Connecting...</span>
  </div>
  <button class="pill" id="copy" aria-label="Copy invite link" title="Tap to copy invite link">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
    </svg>
    <span id="code" style="letter-spacing:1px">------</span>
    <span id="copied" style="display:none;color:#4ade80">Copied!</span>
  </button>
</div>

<div id="date"></div>
<section id="riddle"><span class="lab">today’s theme</span><span class="clue" id="clue">Loading…</span></section>
<div id="word" aria-live="polite"></div>
<div id="board"><svg id="lines" viewBox="0 0 6 8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width=".17"></svg></div>
<div id="foot"><div id="prog"></div><button id="hint" type="button"><span id="hintlab">Hint</span></button></div>

<script>
(()=>{'use strict';
const COLS=6,ROWS=8,N=48,$=s=>document.querySelector(s);
const ID=((window.crypto&&crypto.randomUUID)?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now());
const board=$('#board'),svg=$('#lines'),wordEl=$('#word'),hintBtn=$('#hint');
const tiles=[...Array(N)].map(()=>{const b=document.createElement('button');b.type='button';b.className='t';b.tabIndex=-1;board.appendChild(b);return b});
$('#date').textContent=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

// ---- state ----
const L=Array(N).fill('');let targets=[],VALID=new Set(),ready=false,won=false;
let S={found:[],extra:[],prog:0,hints:0,hint:null,hintRevealed:false}; // found:[{t:'th'|'sp',p:[idx]}]
let cur=[],remote=[],bad=[];
const same=(a,b)=>a.length===b.length&&a.every(i=>b.includes(i));
const adj=(a,b)=>a!==b&&Math.abs((a/COLS|0)-(b/COLS|0))<=1&&Math.abs(a%COLS-b%COLS)<=1;
const locked=i=>S.found.some(f=>f.p.includes(i));
const spell=p=>p.map(i=>L[i]).join('');

// ---- ui helpers ----
let holdTimer;function toast(m,ms=1800){hold(m,m==='Spangram!'?'sp':'msg',ms)}
function setWord(txt,cls=''){wordEl.className=cls;wordEl.textContent=txt}
function anim(i,c,d=0){const el=tiles[i];el.style.setProperty('--d',d+'ms');el.classList.remove(c);void el.offsetWidth;el.classList.add(c);el.addEventListener('animationend',()=>el.classList.remove(c),{once:true})}
const wave=(p,step=60)=>p.forEach((i,k)=>anim(i,'wave',k*step));
const pts=p=>p.map(i=>`${i%COLS+.5},${(i/COLS|0)+.5}`).join(' ');
const line=(p,col,x='')=>p.length>1?`<polyline points="${pts(p)}" stroke="${col}" ${x}/>`:'';
function flyToHint(p){const hr=hintBtn.getBoundingClientRect(),hx=hr.left+hr.width/2,hy=hr.top+hr.height/2;p.forEach((idx,k)=>{setTimeout(()=>{const r=tiles[idx].getBoundingClientRect(),d=document.createElement('div');d.style.cssText=`position:fixed;top:${r.top+r.height/2-10}px;left:${r.left+r.width/2-10}px;width:20px;height:20px;background:var(--sel);border-radius:50%;z-index:99;pointer-events:none;transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s`;document.body.appendChild(d);void d.offsetWidth;d.style.transform=`translate(${hx-(r.left+r.width/2)}px,${hy-(r.top+r.height/2)}px) scale(0.5)`;d.style.opacity='0';setTimeout(()=>d.remove(),500)},k*50)})}

function render(){
  tiles.forEach((t,i)=>{
    const f=S.found.find(f=>f.p.includes(i));
    t.classList.toggle('th',!!f&&f.t==='th');
    t.classList.toggle('sp',!!f&&f.t==='sp');
    t.classList.toggle('sel',cur.includes(i)||bad.includes(i));
    t.classList.toggle('rem',remote.includes(i)&&!cur.includes(i)&&!f);
    const isHint = !!S.hint&&S.hint.includes(i)&&!f;
    t.classList.toggle('hint',isHint);
    t.classList.toggle('hint-seq', isHint && S.hintRevealed);
    if(isHint && S.hintRevealed) {
      t.style.setProperty('--d', (S.hint.indexOf(i) * 300) + 'ms');
    } else if(!isHint) {
      t.style.removeProperty('--d');
    }
  });
  svg.innerHTML=
    S.found.map(f=>line(f.p,f.t==='sp'?'var(--span)':'var(--theme)')).join('')+
    line(remote,'var(--remote)')+line(cur,'var(--sel)')+line(bad,'var(--sel)');
  if(cur.length)setWord(spell(cur));
  else if(!wordEl.dataset.hold)setWord('');
  const total=targets.length;
  $('#prog').innerHTML=`<b>${S.found.length}</b> of <b>${total}</b> theme words found.`;
  hintBtn.hidden=won;
  hintBtn.classList.toggle('ready',S.hints>0);
  $('#hintlab').textContent=S.hints>0?'Use Hint':'Hint';
  hintBtn.style.setProperty('--fill', S.prog);
}
function hold(txt,cls,ms=900){clearTimeout(holdTimer);wordEl.dataset.hold=1;setWord(txt,cls);holdTimer=setTimeout(()=>{delete wordEl.dataset.hold;if(!cur.length)setWord('');else setWord(spell(cur));},ms)}

// ---- game logic ----
function reject(p,msg,w){
  bad=[...p];hold(msg,'bad msg',1400);
  p.forEach(i=>anim(i,'shake'));render();
  setTimeout(()=>{bad=[];render()},380);
}
function evaluate(p){
  let w=spell(p);
  let wRev=spell([...p].reverse());
  if(p.length<4)return reject(p,'Too short',w);
  let t=targets.find(t=>(t.w===w||t.w===wRev)&&same(t.p,p));
  if(t){
    const displayWord = t.w; // always show the target word in correct order
    S.found.push({t:t.t,p:[...p]});
    if(S.hint&&same(S.hint,t.p)){S.hint=null;S.hintRevealed=false;}
    wave(p);
    if(t.t==='sp')hold('Spangram!','sp',2200);
    else hold(displayWord,'ok',1200);
  }else if(VALID.has(w)||VALID.has(wRev)){
    const displayWord = VALID.has(w)?w:wRev;
    if(S.extra.includes(displayWord))return reject(p,'Already found',displayWord);
    S.extra.push(displayWord);S.prog++;wave(p,40);flyToHint(p);
    if(S.prog>=3){S.prog=0;S.hints++;hold(`Hint earned! (${displayWord})`,'msg',2500);}
    else hold(`+1 word! (${S.prog}/3 for hint)`,'msg',2000);
  }else return reject(p,'Not in word list',w);
  commit();
}
function checkWin(){
  if(!won&&targets.length&&S.found.length===targets.length){
    won=true;S.hint=null;S.hintRevealed=false;
    $('#riddle').classList.add('done');$('#riddle .lab').textContent='Perfect!';
    setTimeout(()=>tiles.forEach((_,i)=>anim(i,'wave',i*22)),700);
  }
}
function commit(){checkWin();render();sendState()}
function useHint(){
  if(won||!ready)return;
  if(S.hints<1)return toast(`Find ${3-S.prog} more word${3-S.prog===1?'':'s'} for a hint`);
  if(S.hint) {
    if(S.hintRevealed) return toast('Sequence already revealed');
    S.hints--;
    S.hintRevealed=true;
    toast('Sequence revealed!', 2000);
    commit();
    return;
  }
  const open=targets.filter(t=>!S.found.some(f=>same(f.p,t.p)));
  if(!open.length)return;
  S.hints--;S.hint=open[Math.random()*open.length|0].p;toast('Hint revealed!', 2000);
  commit();
}
hintBtn.addEventListener('click',useHint);

// ---- input (drag or tap; tap last tile to submit) ----
let down=false,dragged=false;
function cellAt(e,loose){
  const r=board.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*COLS,y=(e.clientY-r.top)/r.height*ROWS;
  const c=Math.floor(x),w=Math.floor(y);if(c<0||c>=COLS||w<0||w>=ROWS)return -1;
  const dx=x-c-.5,dy=y-w-.5;return loose||dx*dx+dy*dy<.16?w*COLS+c:-1;
}
function pushPath(){render();send({type:'game_sync',action:'path',path:cur})}
function clear(){if(cur.length){cur=[];pushPath()}}
function submit(){const p=cur;cur=[];send({type:'game_sync',action:'path',path:[]});evaluate(p)}
function step(i,fromDrag){
  const last=cur[cur.length-1],k=cur.indexOf(i);
  if(cur.length>=2&&cur[cur.length-2]===i)cur.pop();
  else if(k>=0&&!fromDrag)cur=cur.slice(0,k+1);
  else if(k<0&&cur.length&&adj(last,i)){cur.push(i);anim(i,'pop');if(fromDrag)dragged=true}
  else if(k<0&&!fromDrag){cur=[i];anim(i,'pop')}
  else return;
  pushPath();
}
board.addEventListener('pointerdown',e=>{
  if(won||!ready)return;
  const i=cellAt(e,true);
  if(i<0||locked(i)){clear();return}
  board.setPointerCapture(e.pointerId);
  if(cur.length&&cur[cur.length-1]===i){submit();return}
  down=true;dragged=false;
  if(!cur.length){cur=[i];anim(i,'pop');pushPath()}else step(i,false);
});
board.addEventListener('pointermove',e=>{
  if(!down)return;const i=cellAt(e,false);
  if(i<0||locked(i))return;step(i,true);
});
const up=submitIt=>()=>{if(!down)return;down=false;if(submitIt&&dragged&&cur.length)submit()};
board.addEventListener('pointerup',up(true));board.addEventListener('pointercancel',up(false));
document.addEventListener('pointerdown',e=>{if(!board.contains(e.target)&&!hintBtn.contains(e.target))clear()});

// ---- networking (same protocol as before) ----
const reqCode=(new URLSearchParams(location.search).get('code')||'').trim()||null;
let ws=null,room=null,joining=false,rt=null;
const raw=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
const send=o=>{if(room)raw({...o,from:ID})};
const sendState=()=>send({type:'game_sync',action:'full_state',state:S});
const status=(k,t)=>{$('#dot').style.background={connecting:'#f39c12',online:'#2ecc71',offline:'#e74c3c'}[k]||'#f39c12';$('#status').textContent=t};
function mergeState(s){
  const fresh=(s.found||[]).filter(f=>!S.found.some(x=>same(x.p,f.p)));
  fresh.forEach(f=>{S.found.push(f);wave(f.p);if(f.t==='sp')toast('Spangram!',2200)});
  (s.extra||[]).forEach(w=>{if(!S.extra.includes(w))S.extra.push(w)});
  S.prog=s.prog||0;S.hints=s.hints||0;S.hint=s.hint||null;S.hintRevealed=s.hintRevealed||false;
  if(S.hint&&S.found.some(f=>same(f.p,S.hint))){S.hint=null;S.hintRevealed=false;}
  remote=[];cur=cur.filter(i=>!locked(i));
  checkWin();render();
}
function onMsg(m){
  switch(m.type){
    case 'room_created':case 'room_joined':{
      joining=false;room=m.code||room;$('#code').textContent=room;
      localStorage.setItem('snuggle_last_room_code', room);
      try{const u=new URL(location.href);u.searchParams.delete('action');u.searchParams.set('code',room);history.replaceState(null,'',u)}catch(_){}
      const c=(m.usersCount||(m.type==='room_joined'?2:1));status(c>1?'online':'connecting',c>1?'Synced with friend!':'Waiting');
      if(m.type==='room_joined')send({type:'game_sync',action:'request_state'});
      if(window.snuggleTrack){snuggleTrack(m.type==='room_created'?'room_create':'room_join',{roomCode:room,section:'strands'});snuggleTrack('game_play',{game:'strands',action:m.type==='room_created'?'create':'join',roomCode:room});}
      break}
    case 'user_joined':status('online','Synced with friend!');sendState();break;
    case 'user_left':status('connecting','Waiting');remote=[];render();break;
    case 'game_sync':
      if(m.from===ID)break;
      if(m.action==='request_state')sendState();
      else if(m.action==='path'){remote=Array.isArray(m.path)?m.path:[];render()}
      else if(m.action==='full_state'&&m.state)mergeState(m.state);
      break;
    default:
      if(joining&&/error|not.?found|invalid|fail/i.test(`${m.type} ${m.message||''}`)){
        joining=false;room=null;status('online','Room not found — creating new room...');raw({type:'create_room'});
      }
  }
}
function connect(){
  clearTimeout(rt);
  if(!/^https?:$/.test(location.protocol)){status('offline','Offline');return}
  try{ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}`)}catch(_){status('offline','Offline');return}
  ws.onopen=()=>{const c=room||reqCode;if(c){joining=true;status('online','Joining room...');raw({type:'join_room',code:c})}else{status('online','Creating room...');raw({type:'create_room'})}};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}if(m&&typeof m==='object')onMsg(m)};
  ws.onclose=()=>{status('offline','Disconnected — reconnecting...');rt=setTimeout(connect,3000)};
}
$('#copy').addEventListener('click',async()=>{
  if(!room)return toast('Room not ready yet');
  const url=location.href;
  if(navigator.share){try{await navigator.share({title:'Join my room',url});return}catch(_){}}
  try{await navigator.clipboard.writeText(url)}catch(_){const t=document.createElement('textarea');t.value=url;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
  $('#code').style.display='none';$('#copied').style.display='inline';
  setTimeout(()=>{$('#copied').style.display='none';$('#code').style.display=''},2000);
});

// ---- puzzle data (same /api/strands-daily shape as before) ----
(async()=>{
  try{
    const r=await fetch('/api/strands-daily');if(!r.ok)throw new Error(r.status);
    const d=await r.json(),U=s=>String(s||'').toUpperCase(),ix=([a,b])=>a*COLS+b;
    for(let a=0;a<ROWS;a++)for(let b=0;b<COLS;b++){const i=a*COLS+b;L[i]=U(d.startingBoard[a][b]);tiles[i].textContent=L[i]}
    if(d.spangramCoords&&d.spangramCoords.length)targets.push({w:U(d.spangram),p:d.spangramCoords.map(ix),t:'sp'});
    for(const[w,co]of Object.entries(d.themeCoords||{}))targets.push({w:U(w),p:co.map(ix),t:'th'});
    VALID=new Set((d.solutions||[]).map(U));targets.forEach(t=>VALID.add(t.w));
    $('#clue').textContent=d.clue||'';ready=true;
  }catch(e){console.warn('puzzle load failed',e);$('#clue').textContent='Puzzle unavailable';toast('Could not load today’s puzzle',3000)}
  render();connect();
})();
})();
</script><script src="../../js/analytics.js"></script></body></html>
