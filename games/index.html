  <!-- Bottom Sheet -->
  <div class="bottom-sheet" id="bottom-sheet" role="dialog" aria-hidden="true" aria-label="Feature information">
    <div class="bottom-sheet__backdrop"></div>
    <div class="bottom-sheet__card">
      <div class="bottom-sheet__handle" role="button" aria-label="Close" tabindex="0"></div>
      <h2 class="bottom-sheet__title"></h2>
      <p class="bottom-sheet__text"></p>
    </div>
  </div>

  <script src="../js/analytics.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/snuggle-invite.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlCode = urlParams.get('code');
      if (urlCode) {
        sessionStorage.setItem('snuggle_room_code', urlCode.toUpperCase().trim());
      }

      const roomCode = sessionStorage.getItem('snuggle_room_code');
      if (!roomCode) {
        window.location.href = '/';
        return;
      }
      
      if ((window.self === window.top) && !window.frameElement) {
        window.location.replace(`/games/?code=${encodeURIComponent(roomCode)}`);
        return;
      }
      
      if (!urlCode || urlCode.toUpperCase().trim() !== roomCode) {
        urlParams.set('code', roomCode);
        window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
      }

      if (window.SnuggleInvite) {
        window.SnuggleInvite.connectHub(roomCode);
      }
      
      const catNav = document.getElementById('categories-nav');
      const nytNav = document.getElementById('nyt-nav');
      const retroNav = document.getElementById('retro-nav');
      const backLink = document.getElementById('yt-back-home');
      
      const originalBackHref = backLink.href;
      const originalBackHtml = backLink.innerHTML;

      function openCategoryNav(navToShow) {
        catNav.style.display = 'none';
        nytNav.style.display = 'none';
        retroNav.style.display = 'none';
        navToShow.style.display = 'flex';
        
        backLink.href = '#';
        backLink.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          Back to Categories
        `;
        
        backLink.onclick = (ev) => {
          ev.preventDefault();
          catNav.style.display = 'flex';
          nytNav.style.display = 'none';
          retroNav.style.display = 'none';
          backLink.href = originalBackHref;
          backLink.innerHTML = originalBackHtml;
          backLink.onclick = null;
        };
      }

      document.getElementById('cat-nyt').addEventListener('click', (e) => {
        if (e.target.closest('.nav-btn__info')) return;
        e.preventDefault();
        openCategoryNav(nytNav);
      });

      document.getElementById('cat-retro').addEventListener('click', (e) => {
        if (e.target.closest('.nav-btn__info')) return;
        e.preventDefault();
        openCategoryNav(retroNav);
      });

      // Keep room code in game links
      document.querySelectorAll('.home__nav a.nav-btn').forEach(link => {
        try {
          const currentHref = link.getAttribute('href');
          if (currentHref && !currentHref.startsWith('#') && !currentHref.includes('code=')) {
            const separator = currentHref.includes('?') ? '&' : '?';
            link.setAttribute('href', `${currentHref}${separator}code=${encodeURIComponent(roomCode)}`);
          }
        } catch (e) {}
      });

      ['nav-mario'].forEach((id) => {
        const btn = document.getElementById(id);
        if (btn) {
          btn.addEventListener('click', (e) => {
            if (e.target.closest('.nav-btn__info')) return;
            e.preventDefault();
            const infoBtn = btn.querySelector('.nav-btn__info');
            if (infoBtn) infoBtn.click();
          });
        }
      });

    });
  </script>
</body>
