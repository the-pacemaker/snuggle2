<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="format-detection" content="telephone=no">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snuggle</title>
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#3c280d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2">
  <style>
    body, body.loaded {
      opacity: 1 !important;
      visibility: visible !important;
    }

    /* --- Home Ribbon Styles --- */
    .home-ribbon {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 6px 10px;
      margin-bottom: var(--space-sm, 8px);
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(244, 162, 97, 0.16);
      border-radius: var(--radius-md, 12px);
      position: relative;
      z-index: 10;
      box-sizing: border-box;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .home-ribbon + .home__header {
      padding-top: var(--space-md, 16px);
    }

    .home-ribbon__btn {
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      border: none;
      background: transparent;
      color: #ffffff;
      transition: all 0.2s ease;
      flex-shrink: 0;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 1. Leave Room Button */
    .home-ribbon__leave {
      background: rgba(175, 128, 79, 0.15);
      border: 1px solid rgba(175, 128, 79, 0.3);
      border-radius: var(--radius-sm, 8px);
      padding: 5px 10px;
      gap: 5px;
      color: #f4a261;
      font-size: 13px;
      font-weight: 500;
    }

    .home-ribbon__leave:hover,
    .home-ribbon__leave:focus-visible {
      background: rgba(231, 111, 81, 0.2);
      border-color: rgba(231, 111, 81, 0.45);
      color: #ffffff;
    }

    .home-ribbon__icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* 2. Connection Status */
    .home-ribbon__status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      padding: 4px 6px;
      user-select: none;
      flex: 1;
    }

    .home-ribbon .yt-status-label {
      font-size: 11.5px;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    .home-ribbon .yt-status-dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
    }

    /* 3. Room Code Button */
    .home-ribbon__code {
      position: relative;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(244, 162, 97, 0.2);
      padding: 5px 9px;
      border-radius: var(--radius-sm, 8px);
      gap: 5px;
      font-size: 13px;
    }

    .home-ribbon__code:hover,
    .home-ribbon__code:focus-visible {
      background: rgba(244, 162, 97, 0.15);
      border-color: var(--accent-warm, #f4a261);
    }

    .home-ribbon__code .yt-room-code-icon {
      color: #f4a261;
      opacity: 0.9;
      flex-shrink: 0;
    }

    .home-ribbon__code-text {
      color: #f4a261;
      letter-spacing: 1px;
      font-family: monospace;
      font-size: 14.5px;
      font-weight: 700;
    }

    @media (max-width: 420px) {
      .home-ribbon {
        padding: 5px 8px;
        gap: 4px;
      }
      .home-ribbon__leave {
        padding: 4px 7px;
        font-size: 12px;
      }
      .home-ribbon__code {
        padding: 4px 7px;
        font-size: 12px;
      }
      .home-ribbon__code-text {
        font-size: 13.5px;
      }
    }

    /* Leave Confirm Overlay */
    .leave-confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .leave-confirm-card {
      background: var(--bg-card, #876a4b);
      padding: 24px;
      border-radius: 14px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      color: var(--text-heading, #fff);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(244, 162, 97, 0.25);
    }

    .leave-confirm-prompt {
      margin: 0 0 22px;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
    }

    .leave-confirm-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .leave-confirm-btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .leave-confirm-cancel {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.9);
    }

    .leave-confirm-cancel:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .leave-confirm-leave {
      background: var(--accent-coral, #e76f51);
      border: none;
      color: #fff;
    }

    .leave-confirm-leave:hover {
      background: #d05f43;
    }
  </style>
</head>
<body class="loaded">

    <nav class="home-ribbon" id="home-ribbon" aria-label="Room navigation and status ribbon">

  <script src="js/analytics.js"></script>

  <script src="js/snuggle-invite.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('loaded');
      
      const urlParams = new URLSearchParams(window.location.search);
      const urlCode = (urlParams.get('code') || '').toUpperCase().trim();
      let roomCode = urlCode;

      if (!roomCode) {
        try {
          roomCode = sessionStorage.getItem('snuggle_room_code') || localStorage.getItem('snuggle_room_code');
        } catch (e) {}
      }
      
      if (!roomCode) {
        window.location.href = '/';
        return;
      }

      try {
        sessionStorage.setItem('snuggle_room_code', roomCode);
        localStorage.setItem('snuggle_room_code', roomCode);
      } catch (e) {}
      
      // If loaded directly as the top window (not inside room shell), redirect into /room shell
      const isEmbedded = (window.self !== window.top) || (window.frameElement !== null);
      if (!isEmbedded) {
        window.location.replace(`/room?code=${encodeURIComponent(roomCode)}`);
        return;
      }
      
      if (!urlCode || urlCode.toUpperCase().trim() !== roomCode) {
        urlParams.set('code', roomCode);
        try {
          window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
        } catch (e) {}
      }
      
      localStorage.setItem('snuggle_room_code', roomCode);
      if (!isEmbedded && window.SnuggleInvite) {
        window.SnuggleInvite.connectHub(roomCode);
      }

      // Ensure all navigation links keep the room code in the URL
      document.querySelectorAll('.home__nav a.nav-btn').forEach(link => {
        try {
          const currentHref = link.getAttribute('href');
          if (currentHref && !currentHref.includes('code=')) {
            const separator = currentHref.includes('?') ? '&' : '?';
            link.setAttribute('href', `${currentHref}${separator}code=${encodeURIComponent(roomCode)}`);
          }
        } catch (e) {}
        link.addEventListener('click', () => {
          try {
            const currentHref = link.getAttribute('href');
            if (currentHref && !currentHref.includes('code=')) {
              const separator = currentHref.includes('?') ? '&' : '?';
              link.setAttribute('href', `${currentHref}${separator}code=${encodeURIComponent(roomCode)}`);
            }
          } catch (e) {}
        });
      });
      
      // ── Populate Room Code ──
      const roomCodeDisplay = document.getElementById('room-code-display');
      if (roomCodeDisplay) {
        roomCodeDisplay.textContent = roomCode;
      }

      // ── Connection Status Handling ──
      const statusDot = document.getElementById('home-status-dot');
      const statusLabel = document.getElementById('home-status-label');

      function setStatus(state) {
        if (!statusDot || !statusLabel) return;
        statusDot.className = 'yt-status-dot home-status-dot';
        statusLabel.className = 'yt-status-label home-status-label';

        if (state === 'connected') {
          statusDot.classList.add('yt-status-dot--connected');
          statusLabel.textContent = 'Connected';
          statusLabel.style.color = '#4ade80';
        } else if (state === 'waiting') {
          statusDot.classList.add('yt-status-dot--waiting');
          statusLabel.textContent = 'Waiting';
          statusLabel.style.color = '#f4a261';
        } else if (state === 'connecting') {
          statusDot.classList.add('yt-status-dot--connecting');
          statusLabel.textContent = 'Connecting…';
          statusLabel.style.color = 'var(--text-muted, #ffffff)';
        } else {
          statusDot.classList.add('yt-status-dot--disconnected');
          statusLabel.textContent = 'Disconnected';
          statusLabel.style.color = 'var(--accent-coral, #e76f51)';
        }
      }

      let homeWs = null;
      let pingTimer = null;
      let reconnectTimer = null;
      let currentUsersCount = 1;

      // Check if parent window already has tracked users count
      try {
        if (window.top && typeof window.top.__snuggleUsersCount === 'number') {
          currentUsersCount = window.top.__snuggleUsersCount;
          setStatus(currentUsersCount > 1 ? 'connected' : 'waiting');
        } else {
          setStatus('connecting');
        }
      } catch (_) {
        setStatus('connecting');
      }

      function connectHomeWS() {
        clearTimeout(reconnectTimer);
        clearInterval(pingTimer);

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        const sid = (window.SnuggleInvite && window.SnuggleInvite.getSessionId)
          ? window.SnuggleInvite.getSessionId()
          : (sessionStorage.getItem('snuggle_session_id') || 'usr_' + Math.random().toString(36).slice(2, 10));

        try {
          homeWs = new WebSocket(wsUrl);
        } catch (e) {
          setStatus('disconnected');
          reconnectTimer = setTimeout(connectHomeWS, 3000);
          return;
        }

        homeWs.onopen = () => {
          homeWs.send(JSON.stringify({
            type: 'join_room',
            code: roomCode,
            from: sid,
            sessionId: sid
          }));

          pingTimer = setInterval(() => {
            if (homeWs && homeWs.readyState === 1) {
              homeWs.send(JSON.stringify({ type: 'ping' }));
            }
          }, 25000);
        };

        homeWs.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (!msg) return;

            if (msg.type === 'room_joined') {
              currentUsersCount = msg.usersCount || 1;
              setStatus(currentUsersCount > 1 ? 'connected' : 'waiting');
            } else if (msg.type === 'user_joined') {
              currentUsersCount = 2;
              setStatus('connected');
            } else if (msg.type === 'user_left') {
              currentUsersCount = 1;
              setStatus('waiting');
            } else if (msg.type === 'room_invite') {
              if (window.SnuggleInvite) window.SnuggleInvite.showInviteModal(msg);
            }
          } catch (e) {}
        };

        homeWs.onclose = () => {
          clearInterval(pingTimer);
          let topAlive = false;
          try {
            if (window.top && typeof window.top.__snuggleUsersCount === 'number') {
              topAlive = true;
            }
          } catch (_) {}
          if (!topAlive) {
            setStatus('disconnected');
          }
          reconnectTimer = setTimeout(connectHomeWS, 3000);
        };

        homeWs.onerror = () => {
          setStatus('disconnected');
        };
      }

      connectHomeWS();

      // Listen to status updates broadcast by parent shell
      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'snuggle_users_count') {
          currentUsersCount = event.data.usersCount || 1;
          setStatus(currentUsersCount > 1 ? 'connected' : 'waiting');
        }
      });

      window.addEventListener('beforeunload', () => {
        clearTimeout(reconnectTimer);
        clearInterval(pingTimer);
        if (homeWs) {
          try { homeWs.close(); } catch (_) {}
        }
      });

      // ── Leave Room Button & Modal ──
      const leaveBtn = document.getElementById('leave-room-btn');
      const confirmOverlay = document.getElementById('leave-confirm-overlay');
      const confirmCancel = document.getElementById('leave-confirm-cancel');
      const confirmOk = document.getElementById('leave-confirm-ok');

      if (leaveBtn && confirmOverlay) {
        leaveBtn.addEventListener('click', () => {
          confirmOverlay.style.display = 'flex';
        });

        if (confirmCancel) {
          confirmCancel.addEventListener('click', () => {
            confirmOverlay.style.display = 'none';
          });
        }

        if (confirmOk) {
          confirmOk.addEventListener('click', () => {
            try {
              sessionStorage.removeItem('snuggle_room_code');
              localStorage.removeItem('snuggle_room_code');
            } catch (_) {}
            if (window.top) {
              window.top.location.href = '/';
            } else {
              window.location.href = '/';
            }
          });
        }

        confirmOverlay.addEventListener('click', (e) => {
          if (e.target === confirmOverlay) {
            confirmOverlay.style.display = 'none';
          }
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && confirmOverlay.style.display === 'flex') {
            confirmOverlay.style.display = 'none';
          }
        });
      }

      // ── Room Code Button (Share / Copy) ──
      const shareBtn = document.getElementById('share-room-btn');
      const copiedSpan = document.getElementById('home-code-copied');
      let copyTimer = null;

      function showCopiedFeedback() {
        clearTimeout(copyTimer);
        if (copiedSpan) copiedSpan.classList.add('visible');
        shareBtn.classList.add('copied');
        copyTimer = setTimeout(() => {
          if (copiedSpan) copiedSpan.classList.remove('visible');
          shareBtn.classList.remove('copied');
        }, 2000);
      }

      async function copyLinkToClipboard(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (_) {}

        try {
          const t = document.createElement('textarea');
          t.value = text;
          t.style.position = 'fixed';
          t.style.opacity = '0';
          t.style.top = '0';
          t.style.left = '0';
          document.body.appendChild(t);
          t.focus();
          t.select();
          const successful = document.execCommand('copy');
          document.body.removeChild(t);
          return successful;
        } catch (_) {
          return false;
        }
      }

      if (shareBtn) {
        shareBtn.addEventListener('click', async () => {
          const url = window.location.origin + '/?code=' + encodeURIComponent(roomCode);
          const shareData = {
            title: 'Snuggle',
            text: `Join my room on Snuggle: ${url}`,
            url: url
          };

          // Find the best navigator object with native share capability
          // (top-level window context has primary permissions on mobile)
          let shareNav = null;
          try {
            if (window.top && window.top.navigator && typeof window.top.navigator.share === 'function') {
              shareNav = window.top.navigator;
            }
          } catch (_) {}

          if (!shareNav && typeof navigator !== 'undefined' && typeof navigator.share === 'function') {
            shareNav = navigator;
          }

          if (shareNav) {
            try {
              if (typeof shareNav.canShare === 'function') {
                if (shareNav.canShare(shareData)) {
                  await shareNav.share(shareData);
                  return;
                } else if (shareNav.canShare({ title: 'Snuggle', url: url })) {
                  await shareNav.share({ title: 'Snuggle', url: url });
                  return;
                }
              }
              await shareNav.share(shareData);
              return;
            } catch (err) {
              // If user cancelled or dismissed the native share sheet, do nothing
              if (err && (err.name === 'AbortError' || err.code === 20)) {
                return;
              }
              console.warn('[Snuggle] Native share failed, falling back to copy:', err);
            }
          }

          // Fallback to clipboard copy on desktop or unsupported devices
          await copyLinkToClipboard(url);
          showCopiedFeedback();
        });
      }
    });
  </script>
</body>
