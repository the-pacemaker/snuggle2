<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="format-detection" content="telephone=no">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube — Snuggle</title>
  <meta name="description" content="Watch YouTube videos together in sync with Snuggle. Create or join a room and enjoy any video side by side.">
  <meta property="og:title" content="YouTube — Snuggle">
  <meta property="og:description" content="Watch YouTube videos together in sync, no matter the distance.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#3c280d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
</head>
<body>
  <main class="home" id="yt-lobby">

    <!-- Header / Branding (identical to home) -->
    <header class="home__header">
      <h1 class="home__logo">Snuggle</h1>
      <p class="home__tagline">
        Watch any YouTube video together,<br>
        perfectly in sync
      </p>
    </header>

    <!-- Back link -->
    <a href="/" class="yt-lobby__back" id="yt-back-home" aria-label="Back to home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      Back to Home
    </a>

    <!-- Room Actions (same nav-btn structure as home) -->
    <nav class="home__nav" aria-label="YouTube room options">

      <!-- Create a Room -->
      <button type="button" class="nav-btn" id="yt-create-btn" aria-label="Create a new YouTube room">
        <span class="nav-btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
        </span>
        <span class="nav-btn__label">Create a Room</span>
      </button>

      <!-- Join a Room -->
      <div class="nav-btn nav-btn--expandable" id="yt-join-wrap">
        <button type="button" class="nav-btn__trigger" id="yt-join-btn" aria-expanded="false" aria-controls="yt-join-input-area">
          <span class="nav-btn__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
          </span>
          <span class="nav-btn__label">Join a Room</span>
          <span class="nav-btn__chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </button>

        <!-- Expandable join input -->
        <div class="nav-btn__expand-area" id="yt-join-input-area" aria-hidden="true">
          <div class="yt-join-input-row">
            <input
              type="text"
              id="yt-room-code-input"
              class="yt-code-input"
              placeholder="Enter room code"
              maxlength="6"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              aria-label="Room code"
            >
            <button type="button" class="yt-join-submit" id="yt-join-submit-btn" aria-label="Join room">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
          </div>
          <p class="yt-join-error" id="yt-join-error" aria-live="polite"></p>
        </div>
      </div>

    </nav>

    <!-- Connecting overlay (shown while WS connects) -->
    <div class="yt-lobby-overlay" id="yt-lobby-overlay" aria-hidden="true" aria-live="polite">
      <div class="yt-lobby-overlay__spinner" aria-hidden="true"></div>
      <p class="yt-lobby-overlay__text" id="yt-overlay-text">Connecting…</p>
    </div>

  </main>

  <!-- API Key setup sheet (shown first time if no key stored) -->
  <div class="bottom-sheet" id="yt-apikey-sheet" role="dialog" aria-label="YouTube API key setup" aria-hidden="true">
    <div class="bottom-sheet__backdrop" id="yt-apikey-backdrop"></div>
    <div class="bottom-sheet__card">
      <div class="bottom-sheet__handle"></div>
      <h2 class="bottom-sheet__title">Set Up YouTube Search</h2>
      <p class="bottom-sheet__text">
        To search YouTube videos, enter your YouTube Data API v3 key. It's saved only on your device.<br>
        <a href="https://console.developers.google.com/" class="yt-api-link" target="_blank" rel="noopener">Get a free API key →</a>
      </p>
      <input
        type="text"
        id="yt-apikey-input"
        class="yt-code-input yt-apikey-input"
        placeholder="AIzaSy…"
        autocomplete="off"
        spellcheck="false"
        aria-label="YouTube API key"
      >
      <div class="yt-apikey-actions">
        <button type="button" class="yt-action-btn yt-action-btn--ghost" id="yt-apikey-skip">Skip (URL paste only)</button>
        <button type="button" class="yt-action-btn" id="yt-apikey-save">Save & Continue</button>
      </div>
    </div>
  </div>

  <script src="../js/analytics.js"></script>
  <script src="../js/lobby-core.js"></script>
  <script src="js/lobby.js"></script>
</body>
</html>
