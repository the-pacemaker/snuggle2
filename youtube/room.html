<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="format-detection" content="telephone=no">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room — YouTube · Snuggle</title>
  <meta name="description" content="Watch YouTube videos together in sync on Snuggle.">
  <meta name="theme-color" content="#3c280d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
</head>
<body>
  <!-- Toast notification -->
  <div class="yt-toast" id="yt-toast" aria-live="polite" aria-atomic="true"></div>

  <main class="yt-room" id="yt-room">

    <!-- ── Status Bar ── -->
    <div class="yt-status-bar" id="yt-status-bar">
      <div class="yt-bar-left">
        <a class="yt-lobby__back" style="margin-bottom: 0;" id="yt-back" href="/youtube/" aria-label="Leave room and go back">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          <span>Back</span>
        </a>
        <div class="yt-status-indicator" id="yt-status-indicator" aria-label="Connection status">
          <span class="yt-status-dot" id="yt-status-dot" aria-hidden="true"></span>
          <span class="yt-status-label" id="yt-status-label">Connecting</span>
        </div>
      </div>
      <button
        type="button"
        class="yt-room-code-pill"
        id="yt-room-code-pill"
        aria-label="Copy room code"
        title="Tap to copy"
      >
        <svg class="yt-room-code-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          
          
        </svg>
        <span class="yt-room-code-text" id="yt-room-code-text">——————</span>
        <span class="yt-room-code-copied" id="yt-code-copied" aria-live="polite">Copied!</span>
      </button>
    </div>

    <!-- ── YouTube Player ── -->
    <div class="yt-player-wrap" id="yt-player-wrap">
      <div class="yt-player-empty" id="yt-player-empty" aria-label="No video loaded">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19.1c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.43z"/>
          <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/>
        </svg>
        <p>Add a video to the queue to get started</p>
      </div>
      <!-- YouTube iframe injected here by room.js -->
      <div id="yt-player"></div>
    </div>

    <!-- ── Now Playing + Prev/Next ── -->
    <div class="yt-now-playing" id="yt-now-playing" aria-live="polite" style="display: none;">
      <p class="yt-now-playing__label" id="yt-now-playing-label">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Nothing playing
      </p>
      <div class="yt-controls" id="yt-controls">
        <button type="button" class="yt-ctrl-btn" id="yt-prev-btn" aria-label="Previous video" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="19 20 9 12 19 4 19 20"/>
            <line x1="5" y1="19" x2="5" y2="5"/>
          </svg>
          Prev
        </button>
        <button type="button" class="yt-ctrl-btn" id="yt-next-btn" aria-label="Next video" disabled>
          Next
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 4 15 12 5 20 5 4"/>
            <line x1="19" y1="5" x2="19" y2="19"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ── Queue ── -->
    <section class="yt-queue-section" id="yt-queue-section" aria-label="Video queue">
      <h2 class="yt-section-title">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        Queue
        <span class="yt-queue-count" id="yt-queue-count">0 videos</span>
      </h2>
      <ol class="yt-queue-list" id="yt-queue-list" aria-label="Video queue list">
      </ol>
    </section>

    <!-- ── Add to Queue / Search ── -->
    <section class="yt-search-section" id="yt-search-section" aria-label="Add to queue">
      <h2 class="yt-section-title">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Add to Queue
      </h2>

      <!-- Search bar -->
      <div class="yt-search-bar" id="yt-search-bar-wrap" role="search">
        <svg class="yt-search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="search"
          id="yt-search-input"
          class="yt-search-input"
          placeholder="Search YouTube…"
          autocomplete="off"
          aria-label="Search YouTube videos"
        >
        <button type="button" class="yt-search-clear" id="yt-search-clear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- URL paste bar -->
      <div class="yt-url-bar" id="yt-url-bar-wrap">
        <svg class="yt-url-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <input
          type="url"
          id="yt-url-input"
          class="yt-url-input"
          placeholder="Or paste a YouTube URL…"
          autocomplete="off"
          aria-label="Paste YouTube URL"
        >
        <button type="button" class="yt-url-add" id="yt-url-add-btn" aria-label="Add URL to queue">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>



      <div class="yt-results-wrap" id="yt-results-wrap" aria-live="polite">
        <div class="yt-results-loading" id="yt-results-loading" style="display: none;" aria-label="Loading results">
          <span class="yt-spinner" aria-hidden="true"></span>
          Searching…
        </div>
        <div class="yt-results-grid" id="yt-results-grid" role="list" aria-label="Search results"></div>
        <button type="button" class="yt-load-more" id="yt-load-more-btn" aria-label="Load more results" style="display: none;">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <p class="yt-results-empty" id="yt-results-empty" hidden>No results found. Try a different search.</p>
      </div>
    </section>

  </main>

  <!-- API Key bottom sheet (accessible from room too) -->
  <div class="bottom-sheet" id="yt-room-apikey-sheet" role="dialog" aria-label="YouTube API key" aria-hidden="true">
    <div class="bottom-sheet__backdrop" id="yt-room-apikey-backdrop"></div>
    <div class="bottom-sheet__card">
      <div class="bottom-sheet__handle"></div>
      <h2 class="bottom-sheet__title">YouTube API Key</h2>
      <p class="bottom-sheet__text">
        Saved locally on your device only. Used for video search.<br>
        <a href="https://console.developers.google.com/" class="yt-api-link" target="_blank" rel="noopener">Get a free key →</a>
      </p>
      <input
        type="text"
        id="yt-room-apikey-input"
        class="yt-code-input yt-apikey-input"
        placeholder="AIzaSy…"
        autocomplete="off"
        spellcheck="false"
        aria-label="YouTube API key"
      >
      <div class="yt-apikey-actions">
        <button type="button" class="yt-action-btn yt-action-btn--ghost" id="yt-room-apikey-cancel">Cancel</button>
        <button type="button" class="yt-action-btn" id="yt-room-apikey-save">Save</button>
      </div>
    </div>
  </div>

  <script src="../js/analytics.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="js/room.js"></script>
</body>
</html>
